<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#gradient1)"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#0033A0"/>
      <stop offset="100%" stop-color="#001F5C"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#FFB366"/>
    </linearGradient>
  </defs>
  
  <!-- Cricket Ball -->
  <circle cx="512" cy="400" r="120" fill="#DC2626" opacity="0.9"/>
  <ellipse cx="540" cy="370" rx="40" ry="50" fill="white" opacity="0.15"/>
  <rect x="450" y="395" width="124" height="6" fill="white" rx="3" transform="rotate(25 512 400)"/>
  <rect x="450" y="395" width="124" height="6" fill="white" rx="3" transform="rotate(-25 512 400)"/>
  
  <!-- Lightning Bolt Icon -->
  <g transform="translate(512, 600)">
    <path d="M -40 -60 L 10 -10 L -20 -10 L 30 60 L -20 10 L 10 10 Z" fill="url(#gradient2)" stroke="white" stroke-width="4"/>
  </g>
  
  <!-- BATLABZ Text -->
  <text x="512" y="750" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">
    BATLABZ
  </text>
  
  <!-- Tagline -->
  <rect x="362" y="780" width="300" height="50" rx="25" fill="#FF9933"/>
  <text x="512" y="815" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="white" text-anchor="middle" letter-spacing="4">
    PAY & PLAY
  </text>
</svg>
